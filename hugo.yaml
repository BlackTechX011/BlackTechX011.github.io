# Hugo configuration file
title: BlackTechX

# import Blextra as module
module:
  imports:
  - path: github.com/BlackTechX011/Blextra

markup:
  # allow raw html
  goldmark:
    renderer:
      unsafe: true

  # enable Blextra syntax highlight
  highlight:
    noClasses: false

menu:
  main:
    - name: Projects
      pageRef: /projects
      weight: 1
    - name: Blog
      pageRef: /blog
      weight: 2
    - name: Search
      weight: 4
      params:
        type: search
    - name: GitHub
      weight: 5
      url: "https://github.com/BlackTechX011/BlackTechX011.github.io"
      params:
        icon: github
  
 

params:
  highlight:
    copy:
      enable: true
      # hover | always
      display: hover

  navbar:
    displayTitle: true
    displayLogo: false

  footer:
    displayCopyright: true
    displayPoweredBy: false

 
